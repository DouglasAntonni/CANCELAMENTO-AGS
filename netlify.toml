[build]
  command = "npm run build"
  publish = "dist/client"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fallback proxy for TanStack Start SSR
# Note: TanStack Start with Vite produces static assets in dist/client 
# and server in dist/server. If using Netlify adapter it needs nitro configuration.
# Assuming standard single-page app fallback for now if SSR isn't explicitly configured for Netlify Edge.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
